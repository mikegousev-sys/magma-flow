# magma_vision.conf — настройки процесса зрения (скорость по камере, уровень).
#
# Файл перечитывается на ходу: правка любого значения здесь и сохранение
# применяется к следующей серии кадров БЕЗ перезапуска magma_vision.
# Исключение — output.host и output.port (см. ниже): их смена требует
# перезапуска процесса, поскольку требует перепривязки уже открытого сокета.
#
# Строки, начинающиеся с '#', и пустые строки игнорируются.
# Формат: ключ = значение (пробелы вокруг '=' необязательны).


# ==================== КАМЕРА ====================
# Структурные параметры: при их изменении камера будет переоткрыта.

camera.device = /dev/video0
camera.width = 1280
camera.height = 1024
camera.frame_rate = 120
camera.buffer_count = 6
camera.timeout_ms = 2000


# ==================== УПРАВЛЕНИЕ КАМЕРОЙ (VEYE) ====================
# Путь к скрипту из комплекта драйвера и номер шины I2C. Шину узнать
# командой `i2cdetect -l` на самой Raspberry Pi — она зависит от того,
# к какому разъёму подключена камера, и может отличаться между платами.

veye.script = /home/mike/raspberrypi_v4l2/mv_tools_rpi/mv_mipi_i2c_new.sh
veye.i2c_bus = 11


# ==================== РАСПИСАНИЕ СЕРИЙ ====================
# Раз в burst_interval_s секунд снимается серия из burst_frames кадров.
# Из неё же берутся level_frames кадров для измерения уровня (реже, чем
# кадры для скорости, поскольку уровень меняется медленно).

schedule.burst_interval_s = 10
schedule.burst_frames = 120
schedule.level_frames = 9
schedule.warmup_frames = 3


# ==================== ГЕОМЕТРИЯ СЕЧЕНИЯ ЖЁЛОБА ====================
# Дуга окружности радиуса channel_radius_mm, переходящая по касательной в
# прямые стенки с наклоном wall_angle_deg от вертикали (0 — чистая дуга).
# Профиль установки «R150 + стенки 22.5°»: касание на 92.6 мм, полуширина
# 138.6 мм; край рабочего профиля — 135 мм (полуширина 156.1 мм).

geometry.channel_radius_mm = 150
geometry.wall_angle_deg = 22.5
geometry.max_level_mm = 135


# ==================== КАЛИБРОВКА: УГОЛ И МАСШТАБ ====================
#
# ОСНОВНОЙ ПУТЬ — калибровочные метки. Нужно не менее трёх неподвижных
# точек на бортах жёлоба с известным взаимным расположением (в миллиметрах,
# в плоскости расплава: u — вдоль потока, v — поперёк) и их пиксельными
# координатами на снятом кадре (см. diagnostics.dir ниже, чтобы получить
# такой кадр). По ним угол камеры и масштаб вычисляются автоматически, а
# при повторном измерении (метки сдвинулись физически или были размечены
# заново точнее) достаточно поправить числа здесь — калибровка обновится
# сама, без перезапуска.
#
# Формат строки метки: u=<мм вдоль потока> v=<мм поперёк потока>
#                       x=<пиксель по горизонтали> y=<пиксель по вертикали>
#                       name=<подпись, для собственного удобства>
#
# Раскомментируйте и впишите реальные координаты после разметки кадра:
#
# calibration.mark = u=0   v=0   x=120.5 y=340.2 name=near-left
# calibration.mark = u=400 v=0   x=610.0 y=210.7 name=far-left
# calibration.mark = u=0   v=250 x=145.0 y=520.9 name=near-right
# calibration.mark = u=400 v=250 x=635.0 y=380.1 name=far-right

# ЗАПАСНОЙ ПУТЬ — ручные значения. Используются, пока меток меньше трёх
# (или если calibration.manual = true задано явно, что удобно для быстрой
# проверки на глаз без физической разметки жёлоба). Значения по умолчанию
# ниже — то, что было определено по опорному снимку с пирометра при первой
# прикидке: угол около 31°, масштаб при объективе 30 мм (пересчитано с 50 мм,
# 2026-09-14: 0.2481 × 50/30 = 0.4135) и дистанции 4 м. При смене объектива
# обратно на 50 мм верните 0.2481 — пересчёт линейный, scale ∝ 1/f при той же
# дистанции и матрице.

# 2026-09-19: калибровка по сетке на поверхности — 0.548 мм/px вдоль потока,
# 0.638 поперёк (level.axis.scale_across_mm_per_px); угол камеры ~52° от
# горизонтали, дистанция ~3.5 м. Уточнить по разметке 29.09.
calibration.manual = true
calibration.beta_deg = 52.0
calibration.scale_mm_per_px = 0.548
calibration.flow_angle_deg = 0.0


# ==================== УРОВЕНЬ: ПОРОГИ И ОПОРНАЯ ТОЧКА ====================

# Положение центра зеркала расплава в кадре при УРОВНЕ РОВНО НОЛЬ —
# опорная точка для участника «центр». Определяется один раз по кадру с
# пустым (или почти пустым) жёлобом; при физическом сдвиге камеры его
# нужно будет переопределить.
level.center_reference_px = 300.0

level.min_sharpness = 5.0
level.melt_present_brightness = 40.0
level.outlier_sigmas = 3.0
level.edge_sigma_px = 0.2
level.systematic_sigma_mm = 0.5


# ==================== УРОВЕНЬ: СПОСОБ ИЗМЕРЕНИЯ ====================
# edges     — две кромки зеркала в полосе level.strip.* (участники «ширина» и
#             «центр»); нужен весь жёлоб в кадре.
# axis_edge — ось потока + край корки (magma_axis_level.hpp): для установки,
#             где видна половина жёлоба, а вторую закрывает стенка. Полосы
#             скорости и профили края берутся от полосы flow.strip.*,
#             level.strip.* в этом режиме не используется.
level.mode = axis_edge

# Полосы скорости поперёк потока (ось — полоса наибольшей скорости). Полосы
# должны перекрывать ось с запасом: если максимум на крайней полосе, уровень
# не выдаётся (unreliable). width_px = 0 — ширина flow.strip.average_px.
level.axis.bands = 8
level.axis.width_px = 0
level.axis.band_lines = 5
# Профили края: длина поперёк потока (от центра полосы), шаг, число мест
# вдоль потока; edge_side = +1/-1 — край по ту сторону от оси (по
# направлению поперёк полосы), 0 — к медленным полосам автоматически.
level.axis.edge_length_px = 800
level.axis.edge_step_px = 2
level.axis.edge_columns = 64
level.axis.edge_side = 0
level.axis.min_contrast = 5
level.axis.min_columns = 10
# Полуширина = |ось − край| · масштаб поперёк + корка (на сколько корка
# заходит на зеркало, до 15 мм; отбивка корки меняет его скачком на ~10 мм).
level.axis.scale_across_mm_per_px = 0.638
level.axis.crust_mm = 15


# ==================== ПОЛОСА ВЫБОРКИ ДЛЯ УРОВНЯ ====================
# Где в кадре искать обе кромки зеркала расплава — полоса поперёк потока.
# Координаты — в пикселях кадра; подбираются по диагностическому снимку.

level.strip.center_x_px = 400
level.strip.center_y_px = 512
level.strip.angle_deg = 90
level.strip.length_px = 500
level.strip.average_px = 40
level.strip.samples = 500
level.strip.average_lines = 9


# ==================== ПОИСК КРОМОК ====================

edge.smooth_radius = 3
edge.min_gradient = 3.0
# Порог кромки в долях шума градиента профиля (0 — только min_gradient).
edge.min_gradient_noise = 0
edge.margin_fraction = 0.05
edge.min_separation = 20


# ==================== ПОЛОСА ВЫБОРКИ ДЛЯ СКОРОСТИ ====================
# Где в кадре брать профиль яркости вдоль потока. angle_deg — направление
# ПО течению. Значения — для установки 2026-09-19 (запись 18:46:28): поток
# на верхней трети кадра, ось у верхнего края (y ≈ 40–60), корка ниже.
# average_px — ширина всего видимого потока (в режиме axis_edge на неё
# раскладываются полосы скорости). Длина 900: при 1280 полоса заходит в
# области кадра, где скорость по GCC-PHAT занижается до ~1.4 м/с вместо 2.0.
# Скорость в отчёте — по всей ширине полосы; на оси она выше на ~3%.

flow.strip.center_x_px = 640
flow.strip.center_y_px = 176.5
flow.strip.angle_deg = 12.4
flow.strip.length_px = 900
flow.strip.average_px = 353
flow.strip.samples = 900
flow.strip.average_lines = 15


# ==================== АЛГОРИТМ ОЦЕНКИ СКОРОСТИ ====================

flow.min_speed_ms = 0.4
flow.max_speed_ms = 5.0
flow.velocity_steps = 400
flow.max_interval_frames = 10
flow.background_tau_s = 3.0
flow.min_snr = 4.0
flow.snr_exclusion = 8
flow.min_profiles = 20


# ==================== АДАПТИВНАЯ ВЫДЕРЖКА ====================
# Границы и цель регулятора. Значения по умолчанию рассчитаны под F/6 и
# ожидаемую температуру расплава 1000-1300°C — см. обоснование в
# magma_exposure.hpp. Как правило трогать не нужно; target_level стоит
# снизить, если на диагностических снимках виден пересвет при любой
# выдержке (диафрагму тогда лучше прикрыть физически, а не только
# программно).

exposure.line_time_us = 4.6
exposure.min_exposure_us = 5
exposure.target_level = 210
exposure.tolerance = 15
exposure.max_clipped_fraction = 0.002
exposure.damping = 0.5
exposure.min_gain_db = 0
exposure.max_gain_db = 40
exposure.gain_step_db = 0.1
exposure.gain_increment_db = 2
exposure.max_blur_px = 3.0
exposure.fallback_speed_ms = 1.5


# ==================== ВТОРАЯ КАМЕРА (задел под стереопару) ====================
#
# Полностью независимый набор параметров — своя камера, свой скрипт/шина
# I2C для выдержки, своя калибровка. По умолчанию ОТКЛЮЧЕНА (camera2.device
# пуст) — ничего не открывается и не логируется, пока не задан путь.
#
# ВАЖНО: сюда относится только детект/подключение/автовыдержка второй
# камеры. Расчёт скорости/уровня по-прежнему ведётся ТОЛЬКО по первой
# камере (camera.*) — подключение второго потока к общему расчёту через
# триангуляцию (magma_stereo.hpp) не сделано и не будет сделано заодно с
# этой правкой: это отдельная задача, требующая проверки на реальной паре
# камер (см. PROJECT_STATE.md, п.7). Параметры экспозиции и калибровки
# второй камеры собираются и применяются уже сейчас именно для того, чтобы
# камера была готова физически (наведена, в фокусе, без пересвета) к тому
# моменту, когда стереопара будет подключена к расчёту.
#
# camera2.device = /dev/video1
camera2.width = 1280
camera2.height = 1024
camera2.frame_rate = 60
camera2.buffer_count = 6
camera2.timeout_ms = 2000

veye2.script = /home/mike/raspberrypi_v4l2/mv_tools_rpi/mv_mipi_i2c_new.sh
veye2.i2c_bus = 11

# Калибровка второй камеры — по умолчанию тот же объектив, что и у первой
# (30 мм, F/6, масштаб 0.4135 мм/px @ 4 м), но может отличаться, если на
# камеры физически поставлена разная оптика. Меток пока нет (стереопара не
# смонтирована) — только ручной путь.
calibration2.beta_deg = 31.0
calibration2.scale_mm_per_px = 0.4135
calibration2.flow_angle_deg = 0.0

exposure2.line_time_us = 4.6
exposure2.min_exposure_us = 5
exposure2.target_level = 210
exposure2.tolerance = 15
exposure2.max_clipped_fraction = 0.002
exposure2.damping = 0.5
exposure2.min_gain_db = 0
exposure2.max_gain_db = 40
exposure2.gain_step_db = 0.1
exposure2.gain_increment_db = 2
exposure2.max_blur_px = 3.0
exposure2.fallback_speed_ms = 1.5


# ==================== ВЫВОД ====================

# ВНИМАНИЕ: host и port считываются ТОЛЬКО ПРИ ЗАПУСКЕ процесса. Изменение
# этих двух значений в работающем процессе не применится — потребуется
# перезапуск (`systemctl restart magma-vision` или аналог). Все остальные
# параметры этого файла применяются без перезапуска.
output.host = 0.0.0.0
output.port = 9100

output.print_json = true

# Каталог для диагностических снимков (кадр + текстовая сводка того, что
# программа в нём увидела) — включайте на время наладки положения полос
# выборки и меток, затем ОБЯЗАТЕЛЬНО отключайте (оставьте пустым): файлы не
# удаляются автоматически и будут расходовать место на диске безостановочно,
# в отличие от всего остального в этом проекте.
diagnostics.dir =

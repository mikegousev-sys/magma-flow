# magma_vision_series.conf — настройки поточного прототипа vision_series.py.
#
# Формат и ключи те же, что у code/magma_vision.conf (C++ magma_vision): «ключ = значение»,
# '#' - комментарий. Ключи, которые понимает и C++, здесь имеют тот же смысл; ключи
# series.* читает только Python-прототип (C++ незнакомые ключи игнорирует), поэтому их
# можно дописать и в общий magma_vision.conf. Файл перечитывается на ходу, как у C++.
#
# Значения ниже подобраны по записи rec_20260919-184628 (камера 1280x1024, 214 к/с).


# ==================== РАСПИСАНИЕ СЕРИЙ ====================
# Раз в burst_interval_s секунд - серия из burst_frames соседних кадров.
# burst_interval_s - это и бюджет времени на расчёт одной серии.
schedule.burst_interval_s = 0.2
schedule.burst_frames = 10


# ==================== ГЕОМЕТРИЯ СЕЧЕНИЯ ====================
geometry.channel_radius_mm = 150
geometry.max_level_mm = 135


# ==================== КАЛИБРОВКА ====================
# scale_mm_per_px - масштаб ВДОЛЬ потока (по сетке 18 мм: 0.548).
calibration.manual = true
calibration.beta_deg = 52.0
calibration.scale_mm_per_px = 0.548
calibration.flow_angle_deg = 0.0


# ==================== ПОЛОСА ВЫБОРКИ ДЛЯ СКОРОСТИ ====================
# Как в magma_vision: центр, направление ПО течению (градусы, 0 = вправо, по часовой в
# координатах кадра), длина вдоль потока и ширина поперёк. Для прототипа это весь ROI,
# который делится на series.bands полос поперёк потока.
flow.strip.center_x_px = 640
flow.strip.center_y_px = 176.5
flow.strip.angle_deg = 12.4
flow.strip.length_px = 1280
flow.strip.average_px = 353


# ==================== АЛГОРИТМ ====================
flow.min_speed_ms = 0.4
flow.max_speed_ms = 5.0
flow.min_snr = 4.0
flow.snr_exclusion = 8


# ==================== ВЫВОД ====================
# Порт отличается от C++ (9100), чтобы оба процесса могли работать одновременно.
output.host = 0.0.0.0
output.port = 9101
output.print_json = true


# ==================== ТОЛЬКО PYTHON-ПРОТОТИП (series.*) ====================
series.scale = 0.5                  # масштаб обработки (0.5 = половинное разрешение)
series.bands = 8                    # полос поперёк потока для профиля скорости
series.check_pairs = 1              # пар кадров на серию для проверки phase + LK
series.piv_every = 10               # PIV раз в N серий (0 = выключен)
series.bg_init = 20                 # серий для начального фона
series.bg_step = 0.5                # шаг слежения фона за медианой, ед. яркости на кадр
series.min_shift = 1.0              # px уменьшенного кадра: пик корреляции ближе к нулю - фон
series.agree_pct = 10               # методы согласны, если расходятся не больше, %

# уровень и расход
series.level_every_s = 1.0          # как часто пересчитывать уровень
series.level_window_s = 5.0         # профили полос за это время - для положения оси
series.level_median_n = 5           # в отчёт - медиана последних N пересчётов уровня
series.level_height_px = 800        # высота окна поиска края корки поперёк потока, px камеры
series.scale_across_mm_per_px = 0.638
series.crust_mm = 25
series.gutter_profile = gutter_profile_R150.csv
series.profile_side = 1             # +1: камера видит правую половину чертежа
series.k = 0.67,0.85                # средняя скорость / скорость поверхности
series.rho = 3400                   # плотность шлака, кг/м3
